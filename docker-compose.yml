# Starts the databases on their default ports.
#   docker compose up -d                 start
#   docker compose ps                    wait until cassandra is "healthy" (1-2 min)
#   docker compose down                  stop (keeps data)      docker compose down -v   stop and wipe data
# Optional Chroma server (otherwise Chroma runs embedded in a local folder, CHROMA_MODE=persistent):
#   docker compose --profile chroma-server up -d     and set CHROMA_MODE=http in .env
services:
  mongo:
    image: mongo:7
    container_name: dishcovery-mongo
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]

  cassandra:
    image: cassandra:4.1
    container_name: dishcovery-cassandra
    ports: ["9042:9042"]
    environment:
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=128M
    volumes: [cassandra_data:/var/lib/cassandra]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 12

  dgraph:
    image: dgraph/standalone:latest
    container_name: dishcovery-dgraph
    ports: ["8080:8080", "9080:9080"]
    volumes: [dgraph_data:/dgraph]

  ratel:                      # Dgraph UI -> http://localhost:8000 (connect to http://localhost:8080)
    image: dgraph/ratel:latest
    container_name: dishcovery-ratel
    ports: ["8000:8000"]

  chroma:
    image: chromadb/chroma:latest
    container_name: dishcovery-chroma
    profiles: ["chroma-server"]
    ports: ["8001:8000"]
    volumes: [chroma_data:/data]

volumes:
  mongo_data:
  cassandra_data:
  dgraph_data:
  chroma_data:
